name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported macOS (and its older Swift) and the newest.
        os: [macos-14, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode 16 on macOS 14
        # The default Xcode there is 15.x (Swift 5.10); unroll needs Swift 6, i.e. Xcode or
        # Command Line Tools 16 or later, which is what macOS 14 users have to install too.
        if: matrix.os == 'macos-14'
        run: |
          XCODE="$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select --switch "$XCODE"
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        # Without a device or terminal; device tests are opt-in and never run here.
        run: swift test
      - name: Generated docs are up to date
        run: swift scripts/generate-docs.swift --check
      - name: Release build and smoke test
        run: |
          swift build --configuration release --product unroll
          .build/release/unroll --version
          .build/release/unroll --help > /dev/null
          .build/release/unroll help exit-codes > /dev/null
